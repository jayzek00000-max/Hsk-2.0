:root{box-sizing:border-box;--bg:#fafaf7;--fg:#1c1c1a;--mut:#74746e;--card:#fff;--bd:#e4e3dc;--t1:#d63a3a;--t2:#2f9a4a;--t3:#2f6fd6;--t4:#8a3fd0;--t0:#8a8a84;--acc:#c8372d;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif}
#feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:24px}
.in{width:100%;max-width:420px;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:36px 24px 28px;text-align:center}
.h{font-size:84px;line-height:1.1;font-weight:500;word-break:keep-all}

.ru{font-size:22px;margin-top:14px}

.rb{font-size:22px;line-height:2.3;color:var(--fg);margin-bottom:6px}.rb ruby{margin:0 2px;ruby-position:over}.rb rt{font-size:11px;color:var(--t3)}.ex b{display:block;font-weight:400;font-size:17px;color:var(--fg);margin-bottom:2px}
.btns{display:flex;gap:10px;justify-content:center;margin-top:24px}
button{font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:999px;padding:10px 18px;font-size:15px;cursor:pointer}
button.main{background:var(--acc);color:#fff;border-color:var(--acc)}
#top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:14px;color:var(--mut);pointer-events:none}
#top button{pointer-events:auto;padding:6px 12px;font-size:13px}

const loadHW=()=>{if(window.HanziWriter)return Promise.resolve(true);if(hwP)return hwP;hwP=new Promise(r=>{const t=document.createElement("script");t.src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js";t.onload=()=>r(!!window.HanziWriter);t.onerror=()=>{hwP=null;r(false)};document.head.appendChild(t);setTimeout(()=>r(!!window.HanziWriter),8000)});return hwP};
const ink=()=>getComputedStyle(document.body).color;
function free(d,z,ch){d.innerHTML='<div class="wg" style="font-size:'+Math.round(z*.78)+'px">'+ch+'</div><canvas></canvas>';const dpr=window.devicePixelRatio||1,cv=d.querySelector("canvas");cv.width=z*dpr;cv.height=z*dpr;const x=cv.getContext("2d");x.lineCap=x.lineJoin="round";x.lineWidth=Math.max(8,z/22)*dpr;x.strokeStyle=ink();let on=false;
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
cv.onpointerdown=e=>{on=true;cv.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke();e.preventDefault()};
cv.onpointermove=e=>{if(!on)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke();x.beginPath();x.moveTo(a,b)};
cv.onpointerup=cv.onpointercancel=()=>{on=false}}
function show(m){wm=m||wm;const chs=[...ww],ch=chs[wk];wi.textContent=(wk+1)+" / "+chs.length+"  "+ch;
const z=Math.max(180,Math.min(innerWidth-24,innerHeight-400,440));wc.innerHTML="";const d=document.createElement("div");d.className="wcell";d.style.cssText="width:"+z+"px;height:"+z+"px";wc.appendChild(d);
if(!window.HanziWriter){free(d,z,ch);return}
const hw=HanziWriter.create(d,ch,{width:z,height:z,padding:Math.round(z*.06),strokeColor:ink(),drawingColor:ink(),drawingWidth:Math.max(8,Math.round(z/22)),showOutline:hint,outlineColor:"rgba(128,128,128,.35)",highlightColor:"#d63a3a",strokeAnimationSpeed:1,delayBetweenStrokes:350,showHintAfterMisses:2,onLoadCharDataError:()=>{d.innerHTML="";free(d,z,ch);gl("Для этого знака нет анимации — свободное письмо")}});
if(wm==="anim")hw.loopCharacterAnimation();else hw.quiz({onComplete:()=>{if(wk<chs.length-1){gl("✅ Верно! Дальше");setTimeout(()=>{wk++;show("write")},900)}else{gl("✅ Слово написано! Дальше — «Слово ⏭»");document.getElementById("wnw").classList.add("main")}}})}
let wList=[],wIdx=0;
function setWord(i){wIdx=(i+wList.length)%wList.length;const c=wList[wIdx];ww=c.dataset.w;wk=0;
wr.querySelector(".wh").innerHTML="<b style='font-size:22px'>"+ww+"</b><br>"+c.querySelector(".p").textContent+" — "+c.querySelector(".ru").textContent+"<br><span style='font-size:12px;color:var(--mut)'>слово "+(wIdx+1)+" из "+wList.length+"</span>";
document.getElementById("wnw").classList.remove("main");say(ww);show()}
document.getElementById("wbtn").onclick=()=>{const v=vis();const c=v[Math.round(feed.scrollTop/feed.clientHeight)];if(!c)return;wList=v;wm="anim";
wc.textContent="Загрузка…";wr.hidden=false;loadHW().then(ok=>{if(!ok)gl("Нет интернета — анимация недоступна, доступно свободное письмо");setWord(v.indexOf(c))})};
document.getElementById("wpw").onclick=()=>setWord(wIdx-1);
document.getElementById("wnw").onclick=()=>setWord(wIdx+1);
document.getElementById("vbtn").onclick=()=>{const l=vlist();if(!l.length){gl("Китайский голос не найден. Установите китайский голос в настройках телефона (синтез речи)");return}if(!voice)pick();voice=l[(l.indexOf(voice)+1)%l.length];try{localStorage.setItem("hskV",voice.name)}catch(_){}gl("🎙 "+voice.name+" ("+(l.indexOf(voice)+1)+" из "+l.length+")");say("你好，很高兴认识你。")};
document.getElementById("wa").onclick=()=>show("anim");
function autoAnim(){if(location.hash!=="#animate")return;const b=document.getElementById("wbtn");if(b&&wr.hidden)b.click()}
window.addEventListener("hashchange",autoAnim);setTimeout(autoAnim,250);

document.getElementById("ww").onclick=()=>show("write");
document.getElementById("wx").onclick=()=>show();
document.getElementById("wt").onclick=e=>{hint=!hint;e.target.textContent="Контур: "+(hint?"вкл":"выкл");show()};
document.getElementById("wp").onclick=()=>{wk=(wk+[...ww].length-1)%[...ww].length;show()};
document.getElementById("wn").onclick=()=>{wk=(wk+1)%[...ww].length;show()};
document.getElementById("wq").onclick=()=>{wr.hidden=true;if(wList[wIdx])wList[wIdx].scrollIntoView({block:"start"});wc.innerHTML="";speechSynthesis&&speechSynthesis.cancel()};
let sw=null;
feed.addEventListener("pointerdown",e=>{if(e.target.closest("button,a,canvas"))return;const c=e.target.closest(".card");if(!c)return;sw={c,i:c.querySelector(".in"),x:e.clientX,y:e.clientY,h:false,id:e.pointerId,dx:0}});
feed.addEventListener("pointermove",e=>{if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;if(!sw.h){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.3){sw.h=true;sw.i.style.transition="none"}else return}
sw.dx=dx;sw.i.style.transform="translateX("+dx+"px) rotate("+dx/18+"deg)";sw.i.style.opacity=1-Math.min(Math.abs(dx)/(innerWidth*1.2),.5);if(dx>40)sw.c.dataset.sw="k";else if(dx<-40)sw.c.dataset.sw="n";else delete sw.c.dataset.sw});
const swEnd=e=>{if(!sw||e.pointerId!==sw.id)return;const{c,i,dx,h}=sw;sw=null;if(!h)return;const fin=()=>{i.style.transition="none";i.style.transform="";i.style.opacity="";delete c.dataset.sw};
if(Math.abs(dx)>90){const v=dx>0?"k":"n",w=c.dataset.w,d=dx>0?1:-1;i.style.transition="transform .28s ease-out,opacity .28s";i.style.transform="translateX("+d*innerWidth*1.2+"px) rotate("+d*25+"deg)";i.style.opacity=0;S[w]=v;c.dataset.st=v;try{localStorage.setItem("hskS",JSON.stringify(S))}catch(_){}rc();
setTimeout(()=>{fin();const l=vis(),k=l.indexOf(c);if(l[k+1])l[k+1].scrollIntoView({behavior:"smooth",block:"start"})},290)}else{i.style.transition="transform .2s ease-out,opacity .2s";i.style.transform="";i.style.opacity="";delete c.dataset.sw}};
feed.addEventListener("pointerup",swEnd);feed.addEventListener("pointercancel",swEnd);
feed.addEventListener("scroll",upd);upd();
</script></body></html>
